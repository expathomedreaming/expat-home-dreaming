<script>
// ── LISTING FILES TO LOAD ──
// Add new filenames here when you create new listings
const LISTING_FILES = [
  'listings/provencal-farmhouse-france.md',
  'listings/jungle-villa-costa-rica.md',
  'listings/bali-rice-paddy-villa.md',
  'listings/marrakech-riad.md',
  'listings/ireland-stone-cottage.md',
];

let allListings = [];
let currentFilter = 'all';
let heroTimer;

// ── PARSE MARKDOWN FRONTMATTER ──
function parseFrontmatter(text) {
  const match = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!match) return null;
  try {
    const data = jsyaml.load(match[1]);
    data.body = match[2].trim();
    return data;
  } catch(e) { return null; }
}

// ── FETCH ALL LISTINGS ──
async function loadListings() {
  const results = await Promise.allSettled(
    LISTING_FILES.map(f => fetch(f).then(r => r.text()))
  );
  allListings = results
    .filter(r => r.status === 'fulfilled')
    .map(r => parseFrontmatter(r.value))
    .filter(Boolean)
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  renderListings(allListings);
  renderHero(allListings);
  renderRecent(allListings);
  updateRegionCounts(allListings);
}

// ── RENDER LISTINGS GRID ──
function renderListings(listings) {
  const grid = document.getElementById('listingsGrid');
  const count = document.getElementById('listingsCount');
  if (!listings.length) {
    grid.innerHTML = '<div class="loading-state">No listings found for this region yet.</div>';
    count.textContent = '0 homes';
    return;
  }
  count.textContent = `Showing ${listings.length} home${listings.length !== 1 ? 's' : ''}`;
  grid.innerHTML = listings.map((l, i) => {
    const isFeatured = l.featured && i === 0 && currentFilter === 'all';
    return `
    <a href="${l.listing_url || '#'}" class="listing-card${isFeatured ? ' featured' : ''}" data-region="${l.region}" style="animation-delay:${i * 0.07}s">
      <div class="card-img-wrap">
        <img src="${l.photo}" alt="${l.title}" loading="lazy">
        <div class="card-region-tag">${l.flag || ''} ${l.country}</div>
        ${l.tag ? `<div class="card-new-tag">${l.tag}</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-location">${l.location}</div>
        <div class="card-title">${l.title}</div>
        <div class="card-excerpt">${l.body}</div>
        <div class="card-footer">
          <div>
            <div class="card-price">${l.price}</div>
            <div class="card-details">
              <span>🛏 ${l.bedrooms} bd</span>
              <span>🛁 ${l.bathrooms} ba</span>
              <span>📐 ${l.size}</span>
            </div>
          </div>
          <span class="card-read-more">Read More →</span>
        </div>
      </div>
    </a>`;
  }).join('');
}

// ── RENDER HERO ──
function renderHero(listings) {
  const heroListings = listings.slice(0, 4);
  const slidesEl = document.getElementById('heroSlides');
  const dotsEl = document.getElementById('heroDots');
  slidesEl.innerHTML = heroListings.map(l => `
    <div class="hero-slide" style="background-image:url('${l.photo}')">
      <div class="hero-caption">
        <div class="hero-tag">${l.flag || ''} ${l.country} · ${l.tag || 'Listed'}</div>
        <div class="hero-title">${l.title}</div>
        <div class="hero-meta">
          <div class="hero-price">${l.price}</div>
          <div class="hero-loc">📍 ${l.location}</div>
          <a href="${l.listing_url || '#'}" class="hero-btn">View This Home</a>
        </div>
      </div>
    </div>`).join('');
  dotsEl.innerHTML = heroListings.map((_, i) =>
    `<button class="hero-dot${i === 0 ? ' active' : ''}" onclick="heroGoTo(${i})"></button>`
  ).join('');
  startHeroAuto(heroListings.length);
}

// ── HERO CONTROLS ──
let heroCurrent = 0;
function heroGoTo(n) {
  const slides = document.getElementById('heroSlides');
  const dots = document.querySelectorAll('.hero-dot');
  const total = dots.length;
  heroCurrent = ((n % total) + total) % total;
  slides.style.transform = `translateX(-${heroCurrent * 100}%)`;
  dots.forEach((d, i) => d.classList.toggle('active', i === heroCurrent));
}
function startHeroAuto(total) {
  clearInterval(heroTimer);
  heroTimer = setInterval(() => heroGoTo(heroCurrent + 1), 5500);
}
document.getElementById('heroNext').onclick = () => { heroGoTo(heroCurrent + 1); clearInterval(heroTimer); startHeroAuto(document.querySelectorAll('.hero-dot').length); };
document.getElementById('heroPrev').onclick = () => { heroGoTo(heroCurrent - 1); clearInterval(heroTimer); startHeroAuto(document.querySelectorAll('.hero-dot').length); };

// ── RENDER RECENT SIDEBAR ──
function renderRecent(listings) {
  const el = document.getElementById('recentListings');
  el.innerHTML = listings.slice(0, 4).map(l => `
    <a href="${l.listing_url || '#'}" class="mini-listing">
      <img class="mini-img" src="${l.photo}" alt="${l.title}" loading="lazy">
      <div class="mini-info">
        <div class="mini-loc">${l.flag || ''} ${l.country}</div>
        <div class="mini-title">${l.title}</div>
        <div class="mini-price">${l.price}</div>
      </div>
    </a>`).join('');
}

// ── UPDATE REGION COUNTS ──
function updateRegionCounts(listings) {
  const counts = {};
  listings.forEach(l => { counts[l.region] = (counts[l.region] || 0) + 1; });
  Object.entries(counts).forEach(([region, n]) => {
    const el = document.getElementById(`count-${region}`);
    if (el) el.textContent = n;
  });
}

// ── FILTER ──
function filterListings(region, btn) {
  currentFilter = region;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const filtered = region === 'all' ? allListings : allListings.filter(l => l.region === region);
  renderListings(filtered);
  document.getElementById('listings').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── NEWSLETTER ──
function handleSubscribe() {
  const email = document.getElementById('emailInput').value;
  if (!email || !email.includes('@')) { alert('Please enter a valid email address.'); return; }
  alert(`Thank you! We'll send listings to ${email} starting next Tuesday. 🌍`);
  document.getElementById('emailInput').value = '';
}

// ── BOOT ──
loadListings();
</script>
</body>
</html>
