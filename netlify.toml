  .newsletter-copy { font-family:'Cormorant Garamond',serif; font-size:16px; color:rgba(255,255,255,0.75); line-height:1.6; margin-bottom:16px; }
  .newsletter-input { width:100%; padding:11px 14px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.1); color:#fff; font-family:'Cormorant Garamond',serif; font-size:16px; margin-bottom:10px; outline:none; }
  .newsletter-input::placeholder { color:rgba(255,255,255,0.4); }
  .newsletter-btn { width:100%; padding:12px; background:var(--terracotta); color:#fff; border:none; font-family:'Jost',sans-serif; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; cursor:pointer; transition:background 0.2s; }
  .newsletter-btn:hover { background:var(--terracotta-light); }
  .region-list { list-style:none; display:flex; flex-direction:column; gap:2px; }
  .region-list li a { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); text-decoration:none; color:var(--ink); font-family:'Cormorant Garamond',serif; font-size:17px; transition:color 0.2s,padding-left 0.2s; }
  .region-list li a:hover { color:var(--terracotta); padding-left:6px; }
  .region-list .count { font-family:'Jost',sans-serif; font-size:11px; background:var(--parchment); color:var(--muted); padding:2px 9px; border-radius:20px; }
  .mini-listing { display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--border); text-decoration:none; color:inherit; transition:opacity 0.2s; }
  .mini-listing:hover { opacity:0.75; }
  .mini-listing:last-child { border-bottom:none; }
  .mini-img { width:72px; height:60px; object-fit:cover; flex-shrink:0; background:var(--parchment); }
  .mini-loc { font-family:'Jost',sans-serif; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:var(--terracotta); margin-bottom:3px; }
  .mini-title { font-family:'Cormorant Garamond',serif; font-size:15px; line-height:1.3; color:var(--deep-teal); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .mini-price { font-family:'Playfair Display',serif; font-size:14px; font-weight:600; color:var(--terracotta); margin-top:4px; }

  .divider { display:flex; align-items:center; gap:16px; margin:8px 0 32px; }
  .divider-line { flex:1; height:1px; background:var(--border); }
  .divider-ornament { color:var(--gold); font-size:18px; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:translateY(0)} }

  footer { background:var(--deep-teal); color:rgba(255,255,255,0.65); margin-top:60px; }
  .footer-top { max-width:1280px; margin:0 auto; padding:56px 40px 40px; display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:40px; }
  .footer-col h4 { font-family:'Jost',sans-serif; font-size:10px; letter-spacing:0.25em; text-transform:uppercase; color:var(--gold-light); margin-bottom:16px; }
  .footer-col ul { list-style:none; display:flex; flex-direction:column; gap:8px; }
  .footer-col ul a { font-family:'Cormorant Garamond',serif; font-size:16px; color:rgba(255,255,255,0.55); text-decoration:none; transition:color 0.2s; }
  .footer-col ul a:hover { color:var(--gold-light); }
  .footer-bottom { border-top:1px solid rgba(255,255,255,0.1); padding:20px 40px; text-align:center; font-family:'Jost',sans-serif; font-size:11px; letter-spacing:0.08em; color:rgba(255,255,255,0.3); }

  @media(max-width:960px){ .site-wrap{grid-template-columns:1fr;padding:32px 24px} .footer-top{grid-template-columns:1fr 1fr} header{padding:20px 24px} .hero-caption{padding:30px 28px} }
  @media(max-width:640px){ .listings-grid{grid-template-columns:1fr} .listing-card.featured{grid-template-columns:1fr} .listing-card.featured .card-img-wrap img{height:220px} .footer-top{grid-template-columns:1fr} }
</style>
</head>
