  .card-read-more { display:inline-block; font-family:'Jost',sans-serif; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--deep-teal); border-bottom:1.5px solid var(--gold); padding-bottom:2px; text-decoration:none; margin-top:6px; }
