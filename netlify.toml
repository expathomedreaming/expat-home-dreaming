<style>
  :root {
    --sand: #f5f0e8; --parchment: #ede5d4; --terracotta: #c4673a;
    --terracotta-light: #d4845a; --deep-teal: #1a3a3a; --teal: #2a5252;
    --gold: #b8943f; --gold-light: #d4ae5a; --ink: #1c1c1c;
    --muted: #7a7068; --border: #d8cfc0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--sand); color:var(--ink); font-family:'Cormorant Garamond',serif; font-size:18px; line-height:1.6; }

  .top-bar { background:var(--deep-teal); color:rgba(255,255,255,0.7); text-align:center; padding:8px 20px; font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; }
  .top-bar a { color:var(--gold-light); text-decoration:none; }

  header { background:var(--deep-teal); padding:28px 40px 22px; display:flex; align-items:center; justify-content:space-between; gap:20px; position:sticky; top:0; z-index:100; box-shadow:0 2px 20px rgba(0,0,0,0.25); }
  .logo-block { text-align:center; flex:1; }
  .logo-eyebrow { font-family:'Jost',sans-serif; font-size:9px; letter-spacing:0.35em; text-transform:uppercase; color:var(--gold-light); margin-bottom:4px; }
  .logo-main { font-family:'Playfair Display',serif; font-size:clamp(22px,3vw,34px); font-weight:700; color:#fff; letter-spacing:0.02em; line-height:1.1; }
  .logo-main em { font-style:italic; color:var(--gold-light); }
  .logo-tagline { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13px; color:rgba(255,255,255,0.5); margin-top:3px; letter-spacing:0.05em; }

  nav { background:var(--teal); display:flex; justify-content:center; gap:0; border-bottom:2px solid var(--gold); flex-wrap:wrap; }
  nav a { font-family:'Jost',sans-serif; font-size:11px; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.75); text-decoration:none; padding:14px 22px; transition:all 0.2s; border-bottom:2px solid transparent; margin-bottom:-2px; }
  nav a:hover, nav a.active { color:var(--gold-light); border-bottom-color:var(--gold-light); background:rgba(255,255,255,0.05); }

  /* HERO */
  .hero { position:relative; height:72vh; min-height:480px; overflow:hidden; background:var(--deep-teal); }
  .hero-slides { display:flex; height:100%; transition:transform 0.9s cubic-bezier(.77,0,.18,1); }
  .hero-slide { min-width:100%; height:100%; position:relative; background-size:cover; background-position:center; }
  .hero-slide::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(26,58,58,0.72) 0%,rgba(26,58,58,0.3) 50%,rgba(0,0,0,0.15) 100%); }
  .hero-caption { position:absolute; bottom:0; left:0; right:0; z-index:2; padding:50px 60px; background:linear-gradient(to top,rgba(26,58,58,0.9) 0%,transparent 100%); }
  .hero-tag { display:inline-block; background:var(--terracotta); color:#fff; font-family:'Jost',sans-serif; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; padding:5px 14px; margin-bottom:14px; }
  .hero-title { font-family:'Playfair Display',serif; font-size:clamp(28px,4vw,52px); font-weight:700; color:#fff; line-height:1.15; max-width:700px; text-shadow:0 2px 20px rgba(0,0,0,0.3); }
  .hero-meta { margin-top:16px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .hero-price { font-family:'Playfair Display',serif; font-size:26px; font-weight:600; color:var(--gold-light); }
  .hero-loc { font-family:'Jost',sans-serif; font-size:13px; color:rgba(255,255,255,0.7); letter-spacing:0.08em; }
  .hero-btn { display:inline-block; background:var(--terracotta); color:#fff; font-family:'Jost',sans-serif; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; padding:11px 26px; text-decoration:none; transition:background 0.2s; }
  .hero-btn:hover { background:var(--terracotta-light); }
  .hero-dots { position:absolute; bottom:24px; right:60px; z-index:10; display:flex; gap:8px; }
  .hero-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.35); cursor:pointer; border:none; transition:background 0.2s,transform 0.2s; }
  .hero-dot.active { background:var(--gold-light); transform:scale(1.3); }
  .hero-arrows { position:absolute; top:50%; transform:translateY(-50%); width:100%; display:flex; justify-content:space-between; padding:0 20px; z-index:10; pointer-events:none; }
  .hero-arrow { width:44px; height:44px; background:rgba(26,58,58,0.6); border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; pointer-events:all; transition:background 0.2s; }
  .hero-arrow:hover { background:var(--terracotta); }

  /* FILTER */
  .filter-bar { background:var(--parchment); border-bottom:1px solid var(--border); padding:18px 40px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .filter-label { font-family:'Jost',sans-serif; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
  .filter-btn { font-family:'Jost',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; padding:7px 16px; border:1.5px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; transition:all 0.2s; white-space:nowrap; }
  .filter-btn:hover { background:var(--deep-teal); border-color:var(--deep-teal); color:#fff; }
  .filter-btn.active { background:var(--terracotta); border-color:var(--terracotta); color:#fff; }

  /* LAYOUT */
  .site-wrap { max-width:1280px; margin:0 auto; padding:48px 40px; display:grid; grid-template-columns:1fr 320px; gap:48px; align-items:start; }
  .listings-header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:28px; border-bottom:1px solid var(--border); padding-bottom:14px; }
  .listings-heading { font-family:'Playfair Display',serif; font-size:22px; font-weight:600; color:var(--deep-teal); }
  .listings-count { font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.1em; color:var(--muted); text-transform:uppercase; }
  .listings-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:36px; }

  .listing-card { background:#fff; box-shadow:0 2px 16px rgba(0,0,0,0.06); transition:transform 0.3s,box-shadow 0.3s; cursor:pointer; text-decoration:none; color:inherit; display:block; animation:fadeUp 0.5s ease both; }
  .listing-card:hover { transform:translateY(-4px); box-shadow:0 8px 32px rgba(0,0,0,0.12); }
  .listing-card.featured { grid-column:1/-1; display:grid; grid-template-columns:1.2fr 1fr; }
  .card-img-wrap { position:relative; overflow:hidden; }
  .card-img-wrap img { width:100%; height:220px; object-fit:cover; display:block; transition:transform 0.5s; }
  .listing-card.featured .card-img-wrap img { height:340px; }
  .listing-card:hover .card-img-wrap img { transform:scale(1.04); }
  .card-region-tag { position:absolute; top:14px; left:14px; background:var(--deep-teal); color:#fff; font-family:'Jost',sans-serif; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; padding:4px 10px; z-index:2; }
  .card-new-tag { position:absolute; top:14px; right:14px; background:var(--terracotta); color:#fff; font-family:'Jost',sans-serif; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; padding:4px 10px; z-index:2; }
  .card-body { padding:22px 24px 24px; display:flex; flex-direction:column; gap:10px; }
  .listing-card.featured .card-body { padding:36px; justify-content:center; }
  .card-location { font-family:'Jost',sans-serif; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--terracotta); }
  .card-title { font-family:'Playfair Display',serif; font-size:20px; font-weight:600; line-height:1.25; color:var(--deep-teal); }
  .listing-card.featured .card-title { font-size:28px; }
  .card-excerpt { font-family:'Cormorant Garamond',serif; font-size:16px; color:var(--muted); line-height:1.6; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:8px; padding-top:14px; border-top:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .card-price { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--terracotta); }
